name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit & integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Smoke test CLI & package install
        run: |
          python3 -m pip install -e .
          claude-subagent --version
          CLAUDE_SUBAGENT_NO_CROUTER=1 claude-subagent setup --discover --json
          CLAUDE_SUBAGENT_NO_CROUTER=1 claude-subagent --allow-unconfigured --dry-run -p "ci smoke test"

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Official AgentSkills spec validation
        run: |
          python3 -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          skills-ref validate skills/claude-subagent
